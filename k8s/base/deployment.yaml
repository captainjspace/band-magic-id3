apiVersion: apps/v1
kind: Deployment
metadata:
  name: band-magic-id3
  labels:
    app: band-magic-id3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: band-magic-id3
  template:
    metadata:
      labels:
        app: band-magic-id3
    spec:
      containers:
        - name: band-magic-id3
          imagePullPolicy: Always
          image: registry.home.landman.rocks:5000/band-magic-id3:d68dee1
          # interim: the paused server needs a folder; goes away with file-in/file-out
          args: ["-root", "/data"]
          volumeMounts:
            - name: data
              mountPath: /data
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: data
          emptyDir: {}
